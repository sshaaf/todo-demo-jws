apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  labels:
    app: todo-app
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: backend
data:
  # HTTP Configuration
  QUARKUS_HTTP_PORT: "8080"
  QUARKUS_HTTP_HOST: "0.0.0.0"

  # CORS Configuration
  QUARKUS_HTTP_CORS: "true"
  QUARKUS_HTTP_CORS_ORIGINS: "*"
  QUARKUS_HTTP_CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  QUARKUS_HTTP_CORS_HEADERS: "accept,authorization,content-type"

  # Database Configuration (non-sensitive)
  QUARKUS_DATASOURCE_DB_KIND: "postgresql"
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://todos-database:5432/todos"

  # Hibernate Configuration
  QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: "update"
  QUARKUS_HIBERNATE_ORM_LOG_SQL: "false"

  # Logging
  QUARKUS_LOG_CONSOLE_LEVEL: "INFO"
  QUARKUS_LOG_CONSOLE_FORMAT: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"

  # Health checks
  QUARKUS_HEALTH_EXTENSIONS_ENABLED: "true"
