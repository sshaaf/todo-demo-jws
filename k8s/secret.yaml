apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secrets
  labels:
    app: todo-app
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Database credentials
  # NOTE: These match the existing todos-database service credentials
  QUARKUS_DATASOURCE_USERNAME: "jws"
  QUARKUS_DATASOURCE_PASSWORD: "jws"

# IMPORTANT: In production, use:
# 1. OpenShift sealed secrets
# 2. External secret managers (Vault, AWS Secrets Manager)
# 3. Do NOT commit real secrets to git
# 4. Rotate credentials regularly
